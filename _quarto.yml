project:
  type: website
  output-dir: _site
  preview:
    port: 5899
    browser: true
  render:
    - "*.qmd"
    - "!fragments/"
    - "!class/1-ai-and-git/"
    - "!class/2-how-llms-work/"
    - "!class/3-agents/"
    - "!class/4-web-and-pages/"
    - "!class/5-context-and-quarto/"
    - "!class/6-skills/"
    - "!class/7-apis-and-images/"
    - "!class/8-verification/"
    - "!class/9-animation/"
    - "!class/10-sound/"
    - "!class/11-data-injection/"
    - "!class/12-html-to-pdf/"
    - "!class/13-data-viz/"
    - "!class/14-presentations/"
  resources:
    - "class/"
    - "hw/"
    - "project/"

website:
  title: EMSE 4197
  site-url: https://jhelvy.github.io/intro-to-agentic-engineering/
  repo-url: https://github.com/jhelvy/intro-to-agentic-engineering
  repo-actions: [edit, issue]
  description: 'Course website for the Fall 2027 semester of the EMSE course "Build with AI" at GWU'
  search: true
  sidebar:
    style: "docked"
    background: "dark"
    collapse-level: 1
    search: true
    contents:
      - text: Home
        icon: house-door-fill
        href: index.qmd
      - text: Syllabus
        icon: map-fill
        href: syllabus.qmd
      - text: Schedule
        icon: table
        href: schedule.qmd
      - section: Builds
        icon: hammer
        contents:
          - text: "1: Git Warm-Up"
            href: hw/1-git-warmup.qmd
          - text: "2: Probe the Model"
            href: hw/2-probe-the-model.qmd
          - text: "3: Personal Site"
            href: hw/3-personal-site.qmd
          - text: "4: Deploy Your Site"
            href: hw/4-deploy-site.qmd
          - text: "5: Quarto Site"
            href: hw/5-quarto-site.qmd
          - text: "6: Voice Skill"
            href: hw/6-voice-skill.qmd
          - text: "7: Image Generation"
            href: hw/7-image-generation.qmd
          - text: "8: Consistent Image Set"
            href: hw/8-image-set.qmd
          - text: "9: Animated Explainer"
            href: hw/9-animation.qmd
          - text: "10: Song or Sound Pack"
            href: hw/10-sound.qmd
          - text: "11: Restaurant Menu Site"
            href: hw/11-menu-site.qmd
          - text: "12: Restaurant Menu PDF"
            href: hw/12-menu-pdf.qmd
          - text: "13: Data Story"
            href: hw/13-data-story.qmd
      - section: Final Project
        icon: rocket-takeoff-fill
        contents:
          - text: Overview
            href: project/0-overview.qmd
          - text: Proposal
            href: project/1-proposal.qmd
          - text: Final Project
            href: project/2-final.qmd
      - text: Software & Setup
        icon: download
        href: software.qmd
      - text: FAQ
        icon: question-square-fill
        href: faq.qmd
      - text: Resources
        icon: bookmark-fill
        href: references.qmd
      - section: Other
        icon: question-circle-fill
        contents:
          - text: About
            icon: question-circle-fill
            href: about.qmd
          - text: License
            icon: award-fill
            href: LICENSE.qmd
          - text: Contact
            icon: envelope-fill
            href: mailto:jph@gwu.edu
          - text: Source files
            icon: github
            href: https://github.com/jhelvy/intro-to-agentic-engineering
  page-footer:
    center:
      - text: "© 2027 John Paul Helveston {{< fa creative-commons-sa >}} <a href='LICENSE.html'><i class='fab fa-creative-commons'></i><i class='fab fa-creative-commons-by'></i><i class='fab fa-creative-commons-sa'></i></a><br><i class='far fa-calendar-alt'></i> {{< var weekday >}} | <i class='far fa-clock'></i> {{< var time >}} | <i class='fa fa-map-marker-alt'></i> {{< var room >}}<br><a href='https://www.jhelvy.com'><i class='fas fa-user'></i> Dr. John Paul Helveston</a> | <a href='mailto:{{< var email >}}'><i class='fas fa-envelope'></i> {{< var email >}}</a> | <a href='{{< var repo >}}'><i class='fab fa-github'></i></a>"

format:
  html:
    theme: minty
    css: styles.css
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

filters:
    - schedule.lua
